services:
  db:
    image: postgres:16-alpine
    container_name: leaveboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leaveboard
      POSTGRES_PASSWORD: leaveboard
      POSTGRES_DB: leaveboard
    ports:
      - '5432:5432'
    volumes:
      - leaveboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leaveboard -d leaveboard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leaveboard-data:
